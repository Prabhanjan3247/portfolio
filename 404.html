<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Prabhanjan P Katti</title>
  <meta name="description" content="Page not found. Navigate back to Prabhanjan P Katti's portfolio.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090B;
      --card: #18181B;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --accent: #3B82F6;
      --accent-rgb: 59,130,246;
      --accent-2: #8B5CF6;
      --text: #FFFFFF;
      --text-secondary: #A1A1AA;
      --text-tertiary: #71717A;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(0.22, 0.9, 0.32, 1);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.5; }
    .page { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .badge { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); border-radius: 999px; padding: 6px 14px; margin-bottom: 32px; display: inline-flex; align-items: center; gap: 8px; animation: fadeUp 0.7s var(--ease) both; }
    .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; position: relative; }
    .pulse-dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--accent); animation: pulseRing 2.2s ease infinite; }
    @keyframes pulseRing { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
    h1 { font-family: var(--font-display); font-size: clamp(6rem, 18vw, 12rem); font-weight: 700; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(135deg, #fff 30%, rgba(59,130,246,0.6)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 16px; animation: fadeUp 0.7s 0.1s var(--ease) both; }
    .subtitle { font-family: var(--font-display); font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 600; color: var(--text); margin-bottom: 12px; animation: fadeUp 0.7s 0.2s var(--ease) both; }
    .desc { color: var(--text-secondary); max-width: 42ch; font-size: 1rem; line-height: 1.65; margin-bottom: 40px; animation: fadeUp 0.7s 0.3s var(--ease) both; }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 48px; animation: fadeUp 0.7s 0.4s var(--ease) both; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 999px; font-family: var(--font-body); font-weight: 600; font-size: 0.94rem; white-space: nowrap; text-decoration: none; transition: transform 180ms var(--ease), background 180ms var(--ease), box-shadow 180ms var(--ease); border: 1px solid transparent; }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: #4c8bfa; transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(59,130,246,0.65); }
    .btn--secondary { background: var(--card); color: var(--text); border-color: var(--border-strong); }
    .btn--secondary:hover { background: #202024; border-color: var(--accent); transform: translateY(-2px); }
    .countdown { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-tertiary); animation: fadeUp 0.7s 0.5s var(--ease) both; }
    .countdown span { color: var(--accent); font-weight: 500; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <canvas id="bg404"></canvas>
  <div class="page">
    <div class="badge"><span class="pulse-dot"></span>Signal lost</div>
    <h1>404</h1>
    <p class="subtitle">Page not found</p>
    <p class="desc">This URL does not map to any known location. The tag drifted out of anchor range.</p>
    <div class="actions">
      <a href="index.html" class="btn btn--primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg>
        Back to Home
      </a>
      <a href="index.html#contact" class="btn btn--secondary">Contact Me</a>
    </div>
    <p class="countdown">Redirecting to home in <span id="countdown">10</span>s</p>
  </div>
  <script>
    (function(){
      var canvas=document.getElementById('bg404'),ctx=canvas.getContext('2d'),ACCENT='59,130,246',ACCENT2='139,92,246',w,h,anchors=[],tagAngle=0;
      function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;build();}
      function build(){var n=w<640?6:10;anchors=[];for(var i=0;i<n;i++)anchors.push({x:Math.random()*w,y:Math.random()*h,phase:Math.random()*Math.PI*2});}
      function draw(t){ctx.clearRect(0,0,w,h);var mx=w<640?200:300;for(var i=0;i<anchors.length;i++){for(var j=i+1;j<anchors.length;j++){var d=Math.hypot(anchors[i].x-anchors[j].x,anchors[i].y-anchors[j].y);if(d<mx){ctx.strokeStyle='rgba('+ACCENT+','+(1-d/mx)*0.16+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(anchors[i].x,anchors[i].y);ctx.lineTo(anchors[j].x,anchors[j].y);ctx.stroke();}}}
      anchors.forEach(function(a){var p=(Math.sin(t/900+a.phase)+1)/2;ctx.beginPath();ctx.arc(a.x,a.y,2.4,0,Math.PI*2);ctx.fillStyle='rgba('+ACCENT+',0.9)';ctx.fill();ctx.beginPath();ctx.arc(a.x,a.y,6+p*16,0,Math.PI*2);ctx.strokeStyle='rgba('+ACCENT+','+(0.2*(1-p))+')';ctx.stroke();});
      if(anchors.length>=3){tagAngle+=0.002;var tx=w*0.5+Math.cos(tagAngle)*w*0.28,ty=h*0.5+Math.sin(tagAngle*1.3)*h*0.22,near=[].concat(anchors).sort(function(a,b){return Math.hypot(a.x-tx,a.y-ty)-Math.hypot(b.x-tx,b.y-ty);}).slice(0,3);ctx.setLineDash([3,5]);near.forEach(function(a){ctx.strokeStyle='rgba('+ACCENT2+',0.25)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(tx,ty);ctx.stroke();});ctx.setLineDash([]);ctx.beginPath();ctx.arc(tx,ty,5,0,Math.PI*2);ctx.fillStyle='rgba('+ACCENT2+',1)';ctx.shadowColor='rgba('+ACCENT2+',0.9)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;}
      requestAnimationFrame(draw);}
      resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
    })();
    var secs=10,el=document.getElementById('countdown');
    var timer=setInterval(function(){secs--;if(el)el.textContent=secs;if(secs<=0){clearInterval(timer);window.location.href='index.html';}},1000);
  </script>
</body>
</html>
